services:
  backend:
    build: ./backend
    init: true
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_PATH: /app/data/atlas.db
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:14b}
      CHAT_TIMEOUT_MS: ${CHAT_TIMEOUT_MS:-120000}
      TZ: ${TZ:-Europe/Rome}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - atlas-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health',{signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 6s
      start_period: 15s
      retries: 3

  frontend:
    build: ./frontend
    init: true
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:3001
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/',{signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 6s
      start_period: 15s
      retries: 3

volumes:
  atlas-data:
